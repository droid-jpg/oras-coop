# Builds the plugin and the one-click Windows package.
# Every run uploads the package as a workflow artifact; pushing a tag like v0.1.0 also
# attaches it to a GitHub release.
name: Package

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install libctrpf and 3gxtool
        run: |
          cat >> /opt/devkitpro/pacman/etc/pacman.conf <<'CONF'

          [thepixellizeross-lib]
          Server = https://thepixellizeross.gitlab.io/packages/any
          SigLevel = Optional

          [thepixellizeross-linux]
          Server = https://thepixellizeross.gitlab.io/packages/x86_64/linux
          SigLevel = Optional
          CONF
          apt-get update && apt-get install -y --no-install-recommends zip
          # pkg.devkitpro.org sometimes answers 403 to CI runners for long stretches. The image
          # already has devkitARM and libctru, so sync only the repos above (a copy of the config
          # without the [dkp-*] sections); dependencies are checked against what's installed.
          awk '/^\[/{skip = ($0 ~ /^\[dkp-/)} !skip' /opt/devkitpro/pacman/etc/pacman.conf > /tmp/tpx.conf
          for i in 1 2 3; do
            dkp-pacman --config /tmp/tpx.conf -Sy --noconfirm &&
              dkp-pacman --config /tmp/tpx.conf -S --noconfirm --needed libctrpf 3gxtool && exit 0
            echo "package download failed (attempt $i), retrying in 20 s"; sleep 20
          done
          exit 1

      - name: Build
        run: bash scripts/build.sh

      - name: Package
        run: |
          bash scripts/package.sh
          echo "PKG=$(basename dist/*-windows.zip -windows.zip)" >> "$GITHUB_ENV"

      # Uploaded as zips so the Mac .command files keep their executable bit.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG }}-windows
          path: dist/${{ env.PKG }}-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG }}-mac
          path: dist/${{ env.PKG }}-mac.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
