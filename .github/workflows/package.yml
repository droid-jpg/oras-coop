# Builds the plugin and the one-click Windows package.
# Every run uploads the package as a workflow artifact; pushing a tag like v0.1.0 also
# attaches it to a GitHub release.
name: Package

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install libctrpf and 3gxtool
        run: |
          cat >> /opt/devkitpro/pacman/etc/pacman.conf <<'CONF'

          [thepixellizeross-lib]
          Server = https://thepixellizeross.gitlab.io/packages/any
          SigLevel = Optional

          [thepixellizeross-linux]
          Server = https://thepixellizeross.gitlab.io/packages/x86_64/linux
          SigLevel = Optional
          CONF
          apt-get update && apt-get install -y --no-install-recommends zip
          dkp-pacman -Sy --noconfirm
          dkp-pacman -S --noconfirm --needed libctrpf 3gxtool

      - name: Build
        run: bash scripts/build.sh

      - name: Package
        run: |
          bash scripts/package.sh
          echo "PKG=$(basename dist/*.zip .zip)" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG }}
          path: dist/${{ env.PKG }}/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ env.PKG }}.zip
